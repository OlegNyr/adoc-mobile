name: docs

on:
  push:
    branches: [master]
    paths:
      - 'doc/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'doc/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка и проверка документации
    runs-on: ubuntu-latest

    steps:
      - name: Получение исходников
        uses: actions/checkout@v7.0.1

      - name: Установка Ruby
        uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: '3.4'

      # PlantUML-диаграммы в tasks.adoc используют component-раскладку,
      # которой нужен dot. На образе ubuntu graphviz не предустановлен.
      - name: Установка Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz

      # Начиная с asciidoctor-diagram 3.0 гем plantuml не подтягивается
      # транзитивно и ставится отдельно. Требовать его через --require нельзя:
      # это обёртка над JAR без загружаемой точки входа, её находит сам
      # asciidoctor-diagram по факту установки.
      - name: Установка Asciidoctor и PlantUML
        run: |
          gem install --no-document \
            asciidoctor:2.0.26 \
            asciidoctor-diagram:3.2.1 \
            asciidoctor-diagram-plantuml:1.2026.2
          asciidoctor --version
          dot -V

      # Локально сборка идёт в /dev/null, но здесь нужен реальный вывод:
      # по нему проверяются ссылки и наличие отрисованных диаграмм.
      # Дизайн-бандл исключён: он ввозной и тянет чужие внешние ссылки.
      - name: Копирование дерева документации
        run: |
          mkdir -p build/docs
          rsync -a --exclude 'project/' doc/ build/docs/

      # Перечисление каталогов заменено обходом дерева: список отставал от
      # репозитория, и документация фич (doc/features/**) в сборку не попадала
      # вовсе. Найдено при работе над потоком 3; чинится один раз и навсегда,
      # потому что новый каталог теперь подхватывается сам.
      - name: Сборка с падением на предупреждениях
        run: |
          mapfile -t docs < <(find build/docs -name '*.adoc' -not -path '*/project/*' | sort)
          test ${#docs[@]} -gt 0
          echo "Собираем ${#docs[@]} документов"
          asciidoctor \
            --require asciidoctor-diagram \
            --failure-level=WARN \
            --attribute attribute-missing=warn \
            "${docs[@]}"

      # Страховка от молчаливой деградации: asciidoctor-diagram умеет
      # не упасть, но и не отрисовать.
      - name: Диаграммы действительно отрисованы
        run: |
          test -s build/docs/tasks-before-mvp.svg
          test -s build/docs/tasks-after-mvp.svg

      - name: Внутренние ссылки и якоря
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --offline
            --include-fragments
            --no-progress
            --verbose
            'build/docs/*.html'
            'build/docs/adr/*.html'
            'build/docs/research/*.html'
            'build/docs/design/*.html'
          output: lychee/internal.md
          fail: true
          failIfEmpty: true

      # failIfEmpty отключён намеренно: внешних ссылок в doc/ может не быть
      # вовсе, и пустой результат — не ошибка.
      - name: Внешние ссылки
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --no-progress
            --verbose
            --extensions adoc
            './doc/**/*.adoc'
          output: lychee/external.md
          fail: true
          failIfEmpty: false

      - name: Собранный HTML как артефакт
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: docs-html
          path: build/docs
          retention-days: 7
