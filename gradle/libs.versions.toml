# Единственное место, где живут версии. Обоснование выбора — doc/adr/adr-001-toolchain-and-versions.adoc.
# Только релизные версии: alpha, beta, RC и ночные сборки не берём.

[versions]
kotlin = "2.4.10"
agp = "9.3.1"
composeMultiplatform = "1.11.1"
# material3 в Compose Multiplatform идёт отдельной версионной линией и отстаёт от
# runtime/foundation/ui. Из-за этого сокращения compose.* объявлены устаревшими:
# они не могут вывести версию. Координаты задаём явно.
composeMaterial3 = "1.9.0"

# JS-движок для рендера AsciiDoc. Обоснование выбора и разбор альтернатив —
# doc/research/render-stack.adoc. Пока только в debug: стенд замеров T-013.
quickjs = "1.0.14"

androidxActivityCompose = "1.13.0"
androidxCoreKtx = "1.19.0"
androidxLifecycle = "2.11.0"

# Инструментальный прогон на устройстве (ADR-006): только раннер — прочее
# (JUnit 4, InstrumentationRegistry из monitor) приезжает транзитивно.
androidxTestRunner = "1.7.0"

# JGit — Git-слой фичи 007 (SL-2): compileOnly в :shared/androidMain (конвейер
# device-тестов KMP-модуля не дексует records — факт спайка E0), рантайм кладёт
# :androidApp через implementation; страж — verifyJGitPackaged.
jgit = "7.7.1.202607240634-r"

# Криптографический бэкенд EdDSA для MINA sshd и для генерации своего ключа
# (ADR-016). Без него sshd ed25519 не знает вовсе: ключ не кодируется в
# проводной формат, а системного алгоритма `Ed25519` на minSdk 26 нет.
# Чистая Java без нативных частей; последний релиз линии 0.3.x.
eddsa = "0.3.0"

# Корутины: код зависит от них напрямую (Flow в контракте GitSync, suspend-швы,
# модели экранов), и версия обязана быть решением каталога, а не тем, что
# случайно притащил Compose. Значение совпадает с транзитивной версией Compose
# 1.11.1 — расхождение при обновлении Compose решается здесь явно.
# Решение владельца 2026-08-17 (журнал 007, отчёт E1).
kotlinxCoroutines = "1.11.0"

# Android SDK. compileSdk 37 — максимум, поддерживаемый AGP 9.3.
compileSdk = "37"
targetSdk = "37"
minSdk = "26"

# JVM-таргет: AGP 9.3 требует JDK не ниже 17.
jvmTarget = "17"

[libraries]
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }

quickjs-kt = { module = "io.github.dokar3:quickjs-kt", version.ref = "quickjs" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCoreKtx" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
jgit = { module = "org.eclipse.jgit:org.eclipse.jgit", version.ref = "jgit" }
# SSH-транспорт JGit (ADR-007): Apache MINA sshd, не JSch. Версия — та же
# линия, что у JGit. Подключается тем же приёмом, что jgit: compileOnly в
# :shared (дексация device-тестов KMP-модуля не пропускает records), рантайм
# и тестовый APK — из :androidApp.
jgit-ssh-apache = { module = "org.eclipse.jgit:org.eclipse.jgit.ssh.apache", version.ref = "jgit" }
# Бэкенд EdDSA (ADR-016). Подключается обычным implementation, а не приёмом
# jgit: records в нём нет, дексацию device-тестов KMP-модуля он не ломает.
# Нужен и нам (генерация ключа), и sshd в рантайме — страж упаковки в APK
# живёт рядом с verifyJGitPackaged.
eddsa = { module = "net.i2p.crypto:eddsa", version.ref = "eddsa" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
# org.jetbrains.kotlin.android намеренно отсутствует: с AGP 9.0 поддержка Kotlin
# встроена в AGP, а отдельный плагин вызывает ошибку применения.
kotlinCompose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
# Для KMP-модуля нужен именно этот плагин: с AGP 9.0 com.android.library
# несовместим с org.jetbrains.kotlin.multiplatform.
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
